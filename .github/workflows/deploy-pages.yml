# Baut die App und veroeffentlicht sie auf GitHub Pages.
#
# Die App ist eine reine Client-Anwendung ohne Server, laesst sich also
# vollstaendig statisch ausliefern. Vor dem Deploy laufen Typpruefung und
# Unit-Tests, damit kein defekter Stand online geht.
#
# EINMALIGE EINRICHTUNG - ohne sie schlaegt der Workflow fehl:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Das Aktivieren von Pages laesst sich nicht aus dem Workflow heraus
# erledigen. Der GITHUB_TOKEN eines Workflows kann keine Pages-Seite
# anlegen ("Resource not accessible by integration"); dafuer waeren
# Administrationsrechte noetig, die sich einem Workflow-Token nicht
# erteilen lassen. Die Einstellung muss deshalb einmal von Hand gesetzt
# werden. Danach laeuft jede weitere Veroeffentlichung automatisch.

name: Auf GitHub Pages veroeffentlichen

on:
  push:
    branches: [main]
  # Erlaubt das manuelle Ausloesen ueber die Actions-Oberflaeche.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deploys nicht abbrechen, aber nur einen gleichzeitig zulassen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Bauen
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Typen pruefen
        run: npm run typecheck

      - name: Unit-Tests
        run: npm test

      - name: Bauen
        # Auf GitHub Pages liegt ein Projekt-Repository unter
        # /<repository-name>/, deshalb muss der Basis-Pfad gesetzt werden.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Schlaegt dieser Schritt mit "Get Pages site failed" fehl, ist Pages
      # im Repository noch nicht eingeschaltet - siehe Hinweis am Anfang
      # dieser Datei.
      - name: Pages einrichten
        uses: actions/configure-pages@v5

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Veroeffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
